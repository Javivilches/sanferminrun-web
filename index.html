#status, #status-splash, #status-progress {
	position: absolute;

#status {
	background-color: #242424;

<script src="prestaciones036.js"></script>
<script>
(() => {
  const fetchAsset = window.fetch.bind(window);
  const files = {"sfr037.wasm": ["application/wasm", 37700666, ["sfr037.wasm.0.bin"]], "sfr037.pck": ["application/octet-stream", 43867436, ["sfr037.pck.comentario19v2.0.bin", "sfr037.pck.comentario19v2.1.bin", "sfr037.pck.comentario19v2.2.bin"]]};
  const gameFiles = new Map(Object.entries(files).map(([name, info]) => [new URL(name, document.baseURI).href, info]));
  window.fetch = async (resource, options) => {
    const url = new URL(typeof resource === "string" ? resource : resource.url || resource, document.baseURI);
    const info = gameFiles.get(url.href);
    if (!info) return fetchAsset(resource, options);
    if (typeof DecompressionStream !== "function") {
      throw new Error("Actualiza Safari o abre el enlace en un navegador actualizado.");
    }
    const parts = info[2];
    let reader;
    let part = 0;
    const compressed = new ReadableStream({
      async pull(controller) {
        while (true) {
          if (!reader) {
            if (part === parts.length) { controller.close(); return; }
            const response = await fetchAsset(new URL(parts[part++], document.baseURI), options);
            if (!response.ok || !response.body) {
              throw new Error("No se pudo descargar el juego. Vuelve a cargar la página.");
            }
            reader = response.body.getReader();
          }
          const chunk = await reader.read();
          if (!chunk.done) { controller.enqueue(chunk.value); return; }
          reader = undefined;
        }
      },
      cancel(reason) { if (reader) return reader.cancel(reason); }
    });
    const body = compressed.pipeThrough(new DecompressionStream("gzip"));
    return new Response(body, {
      headers: {"Content-Type": info[0], "Content-Length": String(info[1])}
    });
  };
})();
</script>
<script src="sfr037.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"sfr037","experimentalVK":true,"fileSizes":{"sfr037.pck":43867436,"sfr037.wasm":37700666},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('No se pudo cargar el juego. Recarga la página.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nEl navegador no tiene todas las funciones que necesita el juego. Actualiza Safari:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden'); window.dispatchEvent(new Event('sfr:ready'));
		}, displayFailureNotice);
	}
}());
		</script>
